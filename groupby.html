<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SQL Aggregation Mastery Studio (GROUP BY & HAVING)</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
</head>
<body>

  <header>
    <div class="header-left">
      <h1>SQL Learning Studio</h1>
      <span class="badge" style="background:#059669;">Step 3: 集計編</span>
      <a href="index.html" style="color: #93c5fd; font-size: 0.85rem; margin-left: 14px; text-decoration: none; font-weight: 600; background: rgba(37, 99, 235, 0.25); padding: 4px 10px; border-radius: 6px;">
        ← 基礎編
      </a>
      <a href="join.html" style="color: #fda4af; font-size: 0.85rem; margin-left: 8px; text-decoration: none; font-weight: 600; background: rgba(225, 29, 72, 0.25); padding: 4px 10px; border-radius: 6px;">
        ← JOIN編
      </a>
    </div>
    <div class="header-right">
      <select id="langSelect" class="lang-select">
        <option value="ja">日本語 (Japanese)</option>
        <option value="en">English (英語)</option>
        <option value="ne">नेपाली (Nepali / ネパール語)</option>
        <option value="fr">Français (French / フランス語)</option>
        <option value="my">မြန်မာ (Burmese)</option>
        <option value="bn">বাংলা (Bengali)</option>
        <option value="si">සිංහල (Sinhala)</option>
        <option value="id">Indonesia</option>
        <option value="vi">Tiếng Việt</option>
        <option value="zh">中文 (中国語)</option>
      </select>
    </div>
  </header>

  <div class="app-layout">
    <!-- 左パネル -->
    <section class="pane left-pane">
      <div class="nav-section">
        <div class="nav-group-title">Part 1: Aggregates (COUNT / SUM / AVG / MAX / MIN)</div>
        <div class="nav-tabs" id="tabPart1"></div>

        <div class="nav-group-title">Part 2: Grouping (GROUP BY)</div>
        <div class="nav-tabs" id="tabPart2"></div>

        <div class="nav-group-title">Part 3: Group Constraints (HAVING)</div>
        <div class="nav-tabs" id="tabPart3"></div>
      </div>

      <div class="card problem-card">
        <h2 id="probTitle"></h2>
        <p class="prob-desc" id="probDesc"></p>
        
        <div class="table-preview-box">
          <div class="table-header-info">
            <span>Target Table: <strong id="targetTableLabel"></strong></span>
            <button class="text-btn" id="previewTableBtn">📋 <span id="viewRawLabel">全データを見る</span></button>
          </div>
          <div class="column-chips" id="columnChips"></div>
        </div>
      </div>

      <div class="accordion-group">
        <details>
          <summary id="hint1Label">💡 ヒント 1: 構文</summary>
          <p id="hint1Text"></p>
        </details>
        <details>
          <summary id="hint2Label">🔍 ヒント 2: テンプレート</summary>
          <pre><code id="hint2Text"></code></pre>
        </details>
        <details>
          <summary id="ansLabel">✅ 模範解答</summary>
          <pre><code id="answerText"></code></pre>
        </details>
      </div>
    </section>

    <!-- 右パネル -->
    <section class="pane right-pane">
      <!-- 集計専用の入力支援チップ -->
      <div class="snippet-bar">
        <span class="snippet-title">Insert:</span>
        <button class="chip" onclick="insertSnippet('COUNT(*) ')">COUNT(*)</button>
        <button class="chip" onclick="insertSnippet('SUM()')">SUM()</button>
        <button class="chip" onclick="insertSnippet('AVG()')">AVG()</button>
        <button class="chip" onclick="insertSnippet('MAX()')">MAX()</button>
        <button class="chip" onclick="insertSnippet('MIN()')">MIN()</button>
        <button class="chip" onclick="insertSnippet('GROUP BY ')">GROUP BY</button>
        <button class="chip" onclick="insertSnippet('HAVING ')">HAVING</button>
        <button class="chip" onclick="insertSnippet('ORDER BY ')">ORDER BY</button>
        <button class="chip" onclick="insertSnippet('DESC ')">DESC</button>
      </div>

      <div class="editor-container">
        <textarea id="sqlInput" spellcheck="false" placeholder="SELECT ..."></textarea>
      </div>

      <div class="action-bar">
        <button id="runBtn" class="btn btn-primary">▶ <span id="runBtnLabel">実行 (Run)</span></button>
        <button id="resetBtn" class="btn btn-secondary"><span id="resetBtnLabel">リセット</span></button>
        <button id="nextBtn" class="btn btn-success" style="display:none;">次の問題へ ➔</button>
        <span class="shortcut-text">Ctrl + Enter</span>
      </div>

      <div id="statusMsg" class="status-msg"></div>

      <div class="result-area">
        <div class="result-tabs">
          <button class="res-tab-btn active" id="tabUserRes">Your Output (あなたの結果)</button>
          <button class="res-tab-btn" id="tabExpectedRes">Expected Output (正解の見本)</button>
        </div>
        <div class="result-table-box" id="tableOutput"></div>
      </div>
    </section>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">Table Data</h3>
        <button class="close-btn" id="closeModalBtn">✖</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script src="data_groupby.js"></script>
  <script src="app.js"></script>
</body>
</html>
